version: "3.9"

services:
  # ── PostgreSQL database ────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: weather_gpt
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # ── Redis cache ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://user:password@db/weather_gpt
      REDIS_URL: redis://redis
    depends_on:
      - db
      - redis

  # ── Streamlit frontend ─────────────────────────────────────────────────────
  frontend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../frontend:/app
    command: >
      sh -c "pip install -r requirements.txt -q &&
             streamlit run weather_gpt_frontend.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  pg_data:
